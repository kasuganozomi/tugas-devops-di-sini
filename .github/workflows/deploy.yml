name: Clean Self-Hosted Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 1. Ambil Kode Repositori (Checkout)
        uses: actions/checkout@v4

      - name: 2. Pemasangan Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. Instalasi Dependensi & Kompilasi
        run: |
          bun install
          bun run build

      - name: 4. Sinkronisasi Bersih ke Direktori Produksi (/app/tugas-devops)
        run: |
          mkdir -p /app/tugas-devops
          rsync -av --delete --exclude='.git' --exclude='.github' ./ /app/tugas-devops/
          echo "Deployment berhasil disinkronkan ke /app/tugas-devops!"
